name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          # Served from https://<owner>.github.io/<repo>/. If you use a custom domain, set this to "/".
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bunx vite build
      - name: Add deep-link fallback
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
          rm -f dist/client/_headers
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
